services:
  db:
    image: postgres:16-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: marketplace-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/marketplace
      DATABASE_USERNAME: marketplace
      DATABASE_PASSWORD: marketplace
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: marketplace-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
