spring:
  application:
    name: marketplace
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USERNAME:marketplace}
    password: ${DATABASE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app_schema
  flyway:
    enabled: true
    schemas: app_schema
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # En production : springdoc.swagger-ui.enabled=false

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: 8080

app:
  jwt-secret: ${JWT_SECRET:dev-secret-change-me-0123456789abcdef-dev}
  jwt-access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  jwt-refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
